<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7422466553554678" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header"><div class="container"><div id="authArea"></div></div></header>
  <main class="container">
    <div id="filterBarPlaceholder"></div>
    <div id="gameGrid"></div>
  </main>
  <div id="playModal"></div>
  <div id="uploadModal"></div>
  <div id="authModal"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      let tries = 0;
      while ((typeof GAMES === 'undefined' || GAMES.length === 0) && tries < 40) {
        await new Promise(r => setTimeout(r, 250));
        tries++;
      }
      const idx = Number(new URLSearchParams(location.search).get('idx') || '0');
      const wait = Number(new URLSearchParams(location.search).get('wait') || '2500');
      const card = document.querySelectorAll('.game-card')[idx];
      card.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      await new Promise(r => setTimeout(r, 200));
      const startBtn = document.getElementById('startGameBtn');
      startBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      await new Promise(r => setTimeout(r, wait));
      document.title = 'READY-FOR-SCREENSHOT';
    })();
  </script>
</body>
</html>
